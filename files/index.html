<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WINE GARDEN — Наше меню</title>
  <meta name="description" content="Электронное меню ресторана авторской кухни WINE GARDEN">
  <meta name="theme-color" content="#0b1f17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="logo">WINE GARDEN</div>
    <p class="tagline">Ресторан авторской кухни</p>
    <div class="divider"></div>
    <h1>Наше меню</h1>
    <p class="subtitle">Выберите блюдо по вкусу</p>

    <div class="search-box">
      <input id="search" type="search" placeholder="Поиск блюда…" autocomplete="off" aria-label="Поиск блюда">
      <button id="clear" type="button" aria-label="Очистить поиск" hidden>×</button>
    </div>
  </header>

  <nav class="cats-wrap" aria-label="Категории меню">
    <div id="cats" class="cats"></div>
  </nav>

  <main id="menu" class="menu"></main>

  <footer class="footer">
    <div class="logo small">WINE GARDEN</div>
    <p>Все цены указаны в узбекских сумах (UZS)</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
